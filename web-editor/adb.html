<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Databricks Local Notebook IDE</title>
<link rel="stylesheet" href="adb.css" />
</head>
<body>
<div id="app">
  <div id="unsupported-banner"></div>
  <header id="topbar">
    <h1>Databricks Local IDE</h1>
    <button id="btn-toggle-sidebar" class="icon-btn" title="Collapse / expand navigation panel">&#9776;</button>
    <span id="repo-name">No repository opened</span>
    <button id="btn-reconnect" class="hidden">Reconnect</button>
    <label class="switch" id="auto-save-switch" title="Automatically save file changes to disk">
      <input id="auto-save-toggle" type="checkbox" checked />
      Auto-save
      <span id="auto-save-status" class="auto-save-status"></span>
    </label>
    <button id="btn-theme-toggle" class="icon-btn" title="Toggle dark / light theme">&#9789;</button>
    <button id="btn-open-repo" class="primary">Open Repository Folder&hellip;</button>
  </header>

  <div id="main">
    <aside id="sidebar">
      <div id="sidebar-toolbar">
        <input id="tree-search" type="text" placeholder="Filter files&hellip;" />
        <div class="row">
          <button id="btn-new-notebook">+ Notebook</button>
          <button id="btn-new-file">+ File</button>
          <button id="btn-new-folder">+ Folder</button>
          <button id="btn-refresh-tree" class="icon-btn" title="Refresh">&#8635;</button>
        </div>
        <div class="row">
          <button id="btn-bind-folder" class="icon-btn" title="Bind an additional folder into the workspace">&#128279; Bind Folder&hellip;</button>
        </div>
      </div>
      <div id="tree-container">
        <ul id="tree-root" class="tree"></ul>
      </div>
    </aside>

    <div id="resizer"></div>

    <section id="editor-panel">
      <div id="editor-global-toolbar">
        <span class="spacer"></span>
        <button id="btn-split-editor" title="Split editor for side-by-side editing">&#9707; Split Editor</button>
      </div>
      <div id="editor-panes">
        <div class="editor-pane" id="pane-a" data-pane="a">
          <div class="pane-tabs" id="pane-a-tabs"></div>
          <div class="pane-toolbar" id="pane-a-toolbar">
            <span class="pane-filename" id="pane-a-filename"></span>
            <select class="lang-select hidden" id="pane-a-lang" title="Default notebook language"></select>
            <span class="spacer"></span>
            <span class="save-status" id="pane-a-status"></span>
            <button class="icon-btn pane-add-cell hidden" id="pane-a-add-cell">+ Cell</button>
            <button class="primary" id="pane-a-save" title="Ctrl+S">Save</button>
          </div>
          <div class="pane-body">
            <div class="pane-empty" id="pane-a-empty">
              Open a repository folder, then select or create a Databricks Notebook to begin editing.
            </div>
            <div class="pane-cells" id="pane-a-cells"></div>
          </div>
        </div>

        <div class="pane-divider hidden" id="pane-divider"></div>

        <div class="editor-pane hidden" id="pane-b" data-pane="b">
          <div class="pane-tabs" id="pane-b-tabs"></div>
          <div class="pane-toolbar" id="pane-b-toolbar">
            <span class="pane-filename" id="pane-b-filename"></span>
            <select class="lang-select hidden" id="pane-b-lang" title="Default notebook language"></select>
            <span class="spacer"></span>
            <span class="save-status" id="pane-b-status"></span>
            <button class="icon-btn pane-add-cell hidden" id="pane-b-add-cell">+ Cell</button>
            <button class="primary" id="pane-b-save" title="Ctrl+S">Save</button>
          </div>
          <div class="pane-body">
            <div class="pane-empty" id="pane-b-empty">
              No file open in this pane. Click a tab or open a file from the tree.
            </div>
            <div class="pane-cells" id="pane-b-cells"></div>
          </div>
        </div>
      </div>
    </section>

    <div id="structure-resizer" class="hidden"></div>

    <aside id="structure-panel" class="hidden">
      <div id="structure-toolbar">
        <span id="structure-title">Notebook Structure</span>
        <button id="btn-structure-collapse" class="icon-btn" title="Collapse all sections">&#8801;</button>
      </div>
      <div id="structure-container"></div>
    </aside>
  </div>

  <footer id="statusbar">
    <span id="status-text">Ready.</span>
  </footer>
</div>

<div id="modal-overlay" class="hidden">
  <div id="modal"></div>
</div>
<div id="context-menu" class="hidden"></div>

<script src="adb.config.js"></script>
<script src="adb.js"></script>
</body>
</html>
